<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#6D4C41" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="90天陪跑" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <title>90天陪跑</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; overflow: hidden; }
    body { font-family: 'PingFang TC', 'Noto Sans TC', 'Hiragino Sans GB', sans-serif; background: #F5EDE3; color: #3E2723; }
    #app { display: flex; flex-direction: column; height: 100%; height: 100dvh; }

    /* ── Header ── */
    #header {
      flex-shrink: 0;
      padding: max(env(safe-area-inset-top, 0px) + 8px, 36px) 16px 16px;
      background: #F5EDE3;
      position: relative;
      overflow: hidden;
    }
    .header-inner { display: flex; align-items: center; gap: 14px; position: relative; }
    .mini-cal { background:#fff; border-radius:16px; box-shadow:0 4px 16px rgba(109,76,65,0.13), 0 1px 4px rgba(109,76,65,0.08); overflow:hidden; flex-shrink:0; width:68px; }
    .mini-cal-top { background:#8D6E63; padding:5px 0 4px; text-align:center; font-size:11px; font-weight:800; color:#fff; letter-spacing:1px; }
    .mini-cal-body { padding:6px 0 8px; text-align:center; }
    .mini-cal-day-num { font-size:30px; font-weight:900; color:#3E2723; line-height:1; letter-spacing:-1px; }
    .mini-cal-weekday { font-size:10px; color:#A1887F; font-weight:600; margin-top:2px; }
    .header-right { flex:1; min-width:0; }
    .header-right-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
    .phase-badge { background:#8D6E63; border-radius:20px; padding:3px 11px; font-size:11px; font-weight:800; color:#fff; letter-spacing:0.5px; }
    .day-counter { font-size:12px; color:#A1887F; font-weight:600; }
    .energy-box { background:#fff; border-radius:14px; padding:9px 13px; box-shadow:0 2px 10px rgba(109,76,65,0.08); border-left:3px solid #C8A882; }
    .energy-label { font-size:10px; font-weight:800; color:#C8A882; letter-spacing:0.8px; margin-bottom:3px; }
    .energy-text { font-size:13px; font-weight:700; color:#5D4037; line-height:1.4; }
    .progress-row { display:flex; align-items:center; gap:8px; margin-top:10px; }
    .progress-wrap { flex:1; background:#E8D5C0; border-radius:10px; height:6px; overflow:hidden; }
    .progress-bar { height:100%; background:linear-gradient(90deg,#A1887F,#C8A882); border-radius:10px; transition:width 1s ease; }
    .progress-label { font-size:11px; color:#A1887F; font-weight:700; white-space:nowrap; }

    /* ── 等級切換條 ── */
    #levelStrip { flex-shrink:0; background:#fff; padding:10px 0; }
    #levelStripInner { display:flex; gap:8px; overflow-x:auto; padding:0 14px; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
    #levelStripInner::-webkit-scrollbar { display:none; }
    .level-pill {
      flex-shrink:0; border:none; cursor:pointer; font-family:inherit;
      padding:9px 16px; border-radius:20px; font-size:13px; font-weight:700;
      background:#F0E6D3; color:#A1887F; white-space:nowrap; transition:all 0.2s;
    }
    .level-pill.active { background:#6D4C41; color:#fff; box-shadow:0 3px 10px rgba(109,76,65,0.3); }

    /* ── 子分頁（學習/每日/我的） ── */
    .sub-tab-row { display:flex; background:#fff; border-top:1px solid #F0E6D3; padding:0 16px; }
    .sub-tab-btn {
      flex:1; border:none; background:none; cursor:pointer; font-family:inherit;
      padding:12px 0; font-size:14px; font-weight:700; color:#C8A882;
      border-bottom:3px solid transparent; transition:all 0.2s;
    }
    .sub-tab-btn.active { color:#6D4C41; border-bottom-color:#8D6E63; }

    /* ── Content ── */
    #content { flex:1; overflow-y:auto; background:#F5EDE3; -webkit-overflow-scrolling:touch; }
    .tab-content { padding:14px 16px 24px; }

    /* 敬請期待 */
    .coming-soon { text-align:center; padding:60px 20px; }
    .coming-soon-icon { font-size:44px; margin-bottom:14px; }
    .coming-soon-text { font-size:14px; color:#A1887F; font-weight:600; line-height:1.6; }

    /* 學習路徑 intro */
    .learn-intro { margin-bottom:14px; }
    .learn-intro-title { font-size:18px; font-weight:800; color:#3E2723; margin-bottom:3px; }
    .learn-intro-desc { font-size:12.5px; color:#A1887F; font-weight:600; }

    /* 階段卡片 */
    .phase-card { background:#fff; border-radius:16px; margin-bottom:12px; box-shadow:0 2px 12px rgba(109,76,65,0.08); overflow:hidden; }
    .phase-card.locked { opacity:0.55; }
    .phase-head { width:100%; border:none; background:none; cursor:pointer; font-family:inherit; padding:15px 16px; display:flex; justify-content:space-between; align-items:center; text-align:left; }
    .phase-head-left { display:flex; align-items:center; gap:12px; min-width:0; }
    .phase-bar { width:4px; height:34px; border-radius:3px; flex-shrink:0; }
    .phase-title { font-size:14.5px; font-weight:800; color:#3E2723; margin-bottom:3px; }
    .phase-sub { font-size:11.5px; color:#A1887F; font-weight:600; }
    .phase-head-right { display:flex; align-items:center; gap:8px; flex-shrink:0; }
    .phase-pct { font-size:12px; font-weight:800; color:#8D6E63; background:#F3EBE5; padding:3px 10px; border-radius:20px; }
    .phase-arrow { font-size:11px; color:#C8A882; }
    .phase-lock { font-size:11.5px; font-weight:700; color:#C8A882; background:#F5EDE7; padding:4px 12px; border-radius:20px; }
    .phase-body { padding:0 16px 12px; }
    .phase-body.hidden { display:none; }
    .phase-item { display:flex; align-items:center; gap:12px; padding:11px 4px; border-top:1px solid #F5EDE7; cursor:pointer; }
    .phase-check { width:22px; height:22px; border-radius:50%; border:2px solid #D7C4A8; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:12px; color:#fff; transition:all 0.2s; }
    .phase-check.checked { background:#8D6E63; border-color:#8D6E63; }
    .phase-item-text { font-size:13.5px; color:#5D4037; line-height:1.5; }
    .phase-item-text.checked { color:#A1887F; text-decoration:line-through; }

    /* 每日總覽卡 */
    .daily-summary-card { background:linear-gradient(135deg,#6D4C41,#8D6E63); border-radius:18px; padding:18px 20px; margin-bottom:16px; color:#fff; }
    .daily-summary-date { font-size:12px; opacity:0.85; margin-bottom:4px; }
    .daily-summary-greet { font-size:18px; font-weight:800; margin-bottom:16px; }
    .daily-summary-stats { display:flex; justify-content:space-between; }
    .daily-stat { text-align:center; flex:1; }
    .daily-stat-num { font-size:26px; font-weight:900; line-height:1; }
    .daily-stat-label { font-size:11px; opacity:0.8; margin-top:4px; font-weight:600; }

    /* Day 1-90 日曆條（每日分頁專用） */
    .day-strip-wrap { margin-bottom:14px; }
    .day-strip-label { font-size:12px; font-weight:700; color:#A1887F; margin-bottom:8px; padding-left:2px; }
    #dailyDayStrip { display:flex; gap:6px; overflow-x:auto; padding:2px 2px 6px; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
    #dailyDayStrip::-webkit-scrollbar { display:none; }
    .ddp {
      flex-shrink:0; min-width:42px; height:50px; border-radius:12px;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      background:#fff; cursor:pointer; border:2px solid transparent; position:relative;
      transition:all 0.15s;
    }
    .ddp-num { font-size:14px; font-weight:800; color:#A1887F; line-height:1; }
    .ddp-sub { font-size:8.5px; color:#C8A882; margin-top:2px; font-weight:600; }
    .ddp.today { border-color:#A1887F; }
    .ddp.selected { background:#6D4C41; }
    .ddp.selected .ddp-num { color:#fff; }
    .ddp.selected .ddp-sub { color:rgba(255,245,235,0.75); }
    .ddp-dot { position:absolute; top:4px; right:5px; width:6px; height:6px; border-radius:50%; background:#8D6E63; }
    .ddp.selected .ddp-dot { background:rgba(255,245,235,0.8); }
    .viewing-day-banner {
      background:#EDE0D4; border-radius:10px; padding:8px 14px; margin-bottom:12px;
      display:flex; justify-content:space-between; align-items:center;
    }
    .viewing-day-banner span { font-size:12px; color:#8D6E63; font-weight:600; }
    .back-today-btn { font-size:11px; font-weight:700; color:#6D4C41; background:#D7C4A8; border:none; border-radius:8px; padding:4px 10px; cursor:pointer; font-family:inherit; }


    /* 額度區塊 */
    .quota-section { background:#fff; border-radius:16px; padding:14px 16px; margin-bottom:14px; box-shadow:0 2px 12px rgba(109,76,65,0.08); }
    .quota-section-head { display:flex; justify-content:space-between; align-items:center; font-size:13.5px; font-weight:800; color:#3E2723; margin-bottom:10px; }
    .quota-section-head span:first-child::before { content:'● '; color:#C8A882; }
    .ratio-tags { display:flex; gap:6px; margin-bottom:12px; flex-wrap:wrap; }
    .ratio-tag { font-size:11px; font-weight:700; padding:4px 10px; border-radius:20px; background:#F5EDE7; color:#8D6E63; }
    .ratio-dot { display:inline-block; width:6px; height:6px; border-radius:50%; margin-right:4px; }
    .quota-item { display:flex; justify-content:space-between; align-items:center; padding:11px 0; border-top:1px solid #F5EDE7; }
    .quota-item:first-child { border-top:none; }
    .quota-item-left { display:flex; align-items:center; gap:10px; }
    .quota-icon { font-size:20px; }
    .quota-item-label { font-size:13.5px; font-weight:700; color:#3E2723; }
    .quota-item-target { font-size:11px; color:#A1887F; margin-top:1px; }
    .quota-counter { display:flex; align-items:center; gap:10px; }
    .quota-btn { width:28px; height:28px; border-radius:50%; border:none; background:#F0E6D3; color:#8D6E63; font-size:17px; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; font-family:inherit; }
    .quota-btn.plus { background:#8D6E63; color:#fff; }
    .quota-btn:active { transform:scale(0.92); }
    .quota-value { font-size:16px; font-weight:800; color:#3E2723; min-width:18px; text-align:center; }
    .quota-item.met .quota-item-label { color:#8D6E63; }
    .quota-value.met { color:#8D6E63; }

    /* 檢核表 */
    .checklist-header { margin-bottom:14px; }
    .checklist-header-title { font-size:18px; font-weight:800; color:#3E2723; margin-bottom:3px; }
    .checklist-header-sub { font-size:12.5px; color:#A1887F; font-weight:600; }
    .checklist-step-card { background:#fff; border-radius:16px; margin-bottom:12px; box-shadow:0 2px 12px rgba(109,76,65,0.08); overflow:hidden; }
    .checklist-step-head { display:flex; align-items:center; gap:10px; padding:13px 16px 10px; }
    .checklist-step-badge { width:26px; height:26px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; color:#fff; flex-shrink:0; }
    .checklist-step-title { font-size:14px; font-weight:800; color:#3E2723; line-height:1.4; }
    .checklist-step-body { padding:0 16px 13px; }
    .checklist-sub-label { font-size:11.5px; font-weight:700; color:#A1887F; margin:6px 0 8px 36px; }
    .checklist-item { display:flex; align-items:flex-start; gap:10px; padding:8px 0 8px 36px; cursor:pointer; }
    .checklist-check { width:20px; height:20px; border-radius:6px; border:2px solid #D7C4A8; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:11px; color:#fff; transition:all 0.2s; margin-top:1px; }
    .checklist-check.checked { border-color:transparent; }
    .checklist-text { font-size:13px; color:#5D4037; line-height:1.55; }
    .checklist-text.checked { color:#A1887F; text-decoration:line-through; }
    .checklist-banner { border-radius:14px; padding:14px; text-align:center; font-size:14px; font-weight:800; color:#fff; margin-top:6px; }

    /* 我的 stats */
    .section-title { font-size:13px; font-weight:700; color:#6D4C41; margin-bottom:12px; margin-top:4px; letter-spacing:0.5px; }
    .milestone-row { display:flex; justify-content:space-between; background:#fff; border-radius:16px; padding:16px 8px; margin-bottom:14px; box-shadow:0 2px 14px rgba(109,76,65,0.09); }
    .milestone { display:flex; flex-direction:column; align-items:center; flex:1; transition:opacity 0.4s; }
    .milestone-icon { font-size:22px; margin-bottom:5px; display:block; transition:transform 0.3s; }
    .milestone-day { font-size:10px; color:#A1887F; font-weight:700; }
    .milestone-label { font-size:9.5px; color:#6D4C41; text-align:center; margin-top:2px; }
    .me-stats-card { background:#fff; border-radius:16px; padding:16px 18px; box-shadow:0 2px 14px rgba(109,76,65,0.09); }
    .me-stat-row { display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-top:1px solid #F5EDE7; }
    .me-stat-row:first-child { border-top:none; }
    .me-stat-label { font-size:13px; color:#6D4C41; font-weight:600; }
    .me-stat-value { font-size:15px; color:#3E2723; font-weight:800; }

    /* Tab Bar */
    #tabbar { display:flex; background:#fff; border-top:1px solid #D7C4A8; padding-top:8px; padding-bottom:env(safe-area-inset-bottom,16px); flex-shrink:0; }
    .tab-btn { flex:1; background:none; border:none; display:flex; flex-direction:column; align-items:center; cursor:pointer; padding:4px 0; }
    .tab-icon-wrap { font-size:22px; margin-bottom:3px; width:36px; height:36px; display:flex; align-items:center; justify-content:center; border-radius:10px; transition:background 0.2s; }
    .tab-icon-wrap.active { background:#F0E6D3; }
    .tab-label { font-size:10px; font-weight:500; color:#A1887F; }
    .tab-label.active { color:#6D4C41; font-weight:700; }

    /* 復盤 */
    .seg-control { display:flex; background:#D7C4A8; border-radius:12px; padding:3px; margin-bottom:18px; }
    .seg-btn { flex:1; border:none; background:none; border-radius:10px; padding:8px 0; font-size:13px; font-weight:600; color:#A1887F; cursor:pointer; transition:all 0.2s; font-family:inherit; }
    .seg-btn.active { background:#fff; color:#3E2723; box-shadow:0 2px 8px rgba(109,76,65,0.15); }
    .prompt-q { font-size:14px; font-weight:600; color:#3E2723; margin-bottom:8px; }
    textarea { width:100%; min-height:80px; border:1.5px solid #D7C4A8; border-radius:12px; padding:12px 14px; font-size:14px; color:#3E2723; background:#fff; resize:none; outline:none; font-family:inherit; line-height:1.65; }
    textarea:focus { border-color:#A1887F; }
    .prompt-group { margin-bottom:16px; }
    .save-btn { width:100%; padding:14px 0; background:linear-gradient(135deg,#6D4C41,#A1887F); color:#fff; border:none; border-radius:14px; font-size:16px; font-weight:700; cursor:pointer; margin-top:4px; letter-spacing:0.8px; font-family:inherit; box-shadow:0 4px 14px rgba(109,76,65,0.35); }
    .save-btn:active { opacity:0.88; transform:scale(0.98); }

    /* 歷史復盤 */
    .history-divider { display:flex; align-items:center; gap:10px; margin:22px 0 14px; }
    .history-divider-line { flex:1; height:1px; background:#D7C4A8; }
    .history-divider-text { font-size:12px; font-weight:700; color:#A1887F; letter-spacing:0.5px; white-space:nowrap; }
    .history-card { background:#fff; border-radius:16px; padding:14px 16px; margin-bottom:12px; box-shadow:0 2px 10px rgba(109,76,65,0.08); }
    .history-date { font-size:11px; font-weight:800; color:#A1887F; letter-spacing:0.5px; margin-bottom:10px; display:flex; align-items:center; gap:6px; }
    .history-date-dot { width:6px; height:6px; border-radius:50%; background:#C8A882; flex-shrink:0; }
    .history-qa { margin-bottom:8px; }
    .history-q { font-size:11px; color:#C8A882; font-weight:700; margin-bottom:3px; }
    .history-a { font-size:13px; color:#5D4037; line-height:1.6; }
    .history-empty { text-align:center; padding:24px 0; font-size:13px; color:#C8A882; }

    /* SOP */
    .sale-header { font-size:20px; font-weight:800; margin-bottom:16px; }
    .accordion { margin-bottom:10px; }
    .accordion-head { width:100%; background:#fff; border:none; border-radius:0 14px 14px 0; padding:14px 16px; display:flex; justify-content:space-between; align-items:center; font-size:15px; font-weight:700; color:#3E2723; cursor:pointer; box-shadow:0 2px 10px rgba(109,76,65,0.08); text-align:left; font-family:inherit; }
    .accordion-body { background:#fff; border-radius:0 0 14px 14px; padding:8px 16px 14px; margin-top:-4px; }
    .check-item { display:flex; align-items:flex-start; gap:10px; padding:9px 0; font-size:13.5px; color:#6D4C41; border-bottom:1px solid #F0E6D3; line-height:1.55; }
    .check-item:last-child { border-bottom:none; }
    .check-dot { width:7px; height:7px; border-radius:50%; flex-shrink:0; margin-top:6px; }
    .hidden { display:none; }
  </style>
</head>
<body>
<div id="app">
  <div id="header">
    <div class="header-inner">
      <div class="mini-cal">
        <div class="mini-cal-top" id="calMonth"></div>
        <div class="mini-cal-body">
          <div class="mini-cal-day-num" id="calDayNum"></div>
          <div class="mini-cal-weekday" id="calWeekday"></div>
        </div>
      </div>
      <div class="header-right">
        <div class="header-right-top">
          <div class="phase-badge" id="phaseBadge"></div>
          <div class="day-counter" id="dayBig"></div>
        </div>
        <div class="energy-box">
          <div class="energy-label">☕ 今日能量補給站</div>
          <div class="energy-text" id="mottoText"></div>
        </div>
      </div>
    </div>
    <div class="progress-row">
      <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
      <div class="progress-label" id="progressLabel"></div>
    </div>
  </div>

  <!-- 等級切換 -->
  <div id="levelStrip">
    <div id="levelStripInner"></div>
  </div>

  <!-- 子分頁（學習/每日/我的） -->
  <div id="subTabRow" class="sub-tab-row">
    <button class="sub-tab-btn active" data-sub="learn" onclick="switchSubTab('learn',this)">學習</button>
    <button class="sub-tab-btn" data-sub="daily" onclick="switchSubTab('daily',this)">每日</button>
    <button class="sub-tab-btn" data-sub="checklist" onclick="switchSubTab('checklist',this)">檢核表</button>
    <button class="sub-tab-btn" data-sub="me" onclick="switchSubTab('me',this)">里程碑</button>
  </div>

  <div id="content">
    <!-- 首頁 -->
    <div id="tab-home" class="tab-content">

      <!-- 敬請期待（二級以上）-->
      <div id="comingSoon" class="coming-soon hidden">
        <div class="coming-soon-icon">🔒</div>
        <div class="coming-soon-text">這個等級的內容還在準備中<br>敬請期待！</div>
      </div>

      <!-- 學習 -->
      <div id="sub-learn" class="sub-tab-content">
        <div class="learn-intro">
          <div class="learn-intro-title" id="learnPathTitle">新夥伴學習路徑</div>
          <div class="learn-intro-desc">完成每個任務，解鎖下一階段</div>
        </div>
        <div id="phaseList"></div>
      </div>

      <!-- 每日 -->
      <div id="sub-daily" class="sub-tab-content hidden">
        <div class="day-strip-wrap">
          <div class="day-strip-label">📅 點選查看 Day 1-90 的紀錄</div>
          <div id="dailyDayStrip"></div>
        </div>
        <div id="dailyEmptyState" class="coming-soon hidden" style="padding:40px 20px;">
          <div class="coming-soon-icon">📝</div>
          <div class="coming-soon-text" id="dailyEmptyText"></div>
        </div>
        <div id="dailyQuotaContainer">
          <div id="viewingDayBanner" class="viewing-day-banner hidden">
            <span id="viewingDayLabel"></span>
            <button class="back-today-btn" onclick="backToTodayQuota()">回到今天</button>
          </div>
          <div class="daily-summary-card">
            <div class="daily-summary-date" id="dailyDateText"></div>
            <div class="daily-summary-greet" id="dailyGreetText"></div>
            <div class="daily-summary-stats">
              <div class="daily-stat"><div class="daily-stat-num" id="statDone">0</div><div class="daily-stat-label">已完成</div></div>
              <div class="daily-stat"><div class="daily-stat-num" id="statTotal">0</div><div class="daily-stat-label">總任務</div></div>
              <div class="daily-stat"><div class="daily-stat-num" id="statStreak">0</div><div class="daily-stat-label">連續天數🔥</div></div>
            </div>
          </div>

          <div class="quota-section">

function dateKey(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function todayKey() { return dateKey(new Date()); }
function dayNumToDate(dayN) {
  const d = new Date(startDate);
  d.setDate(d.getDate() + (dayN - 1));
  return d;
}
function dayNumToKey(dayN) { return dateKey(dayNumToDate(dayN)); }

function getLearnKey(level, phaseIdx, itemIdx) { return `learn_${level}_${phaseIdx}_${itemIdx}`; }
function isLearnChecked(level, phaseIdx, itemIdx) { return localStorage.getItem(getLearnKey(level,phaseIdx,itemIdx)) === '1'; }
function setLearnChecked(level, phaseIdx, itemIdx, val) { localStorage.setItem(getLearnKey(level,phaseIdx,itemIdx), val?'1':'0'); }

function isPhaseComplete(level, phaseIdx) {
  const phase = LEARNING_PATH[level]?.[phaseIdx];
  if (!phase) return false;
  return phase.items.every((_,i) => isLearnChecked(level, phaseIdx, i));
}
function isPhaseUnlocked(level, phaseIdx) {
  if (phaseIdx === 0) return true;
  return isPhaseComplete(level, phaseIdx - 1);
}

function getChecklistKey(level, stepIdx, itemIdx) { return `checklist_${level}_${stepIdx}_${itemIdx}`; }
function isChecklistChecked(level, stepIdx, itemIdx) { return localStorage.getItem(getChecklistKey(level,stepIdx,itemIdx)) === '1'; }
function setChecklistChecked(level, stepIdx, itemIdx, val) { localStorage.setItem(getChecklistKey(level,stepIdx,itemIdx), val?'1':'0'); }

function getQuotaKey(level, dk, itemKey) { return `quota_${level}_${dk}_${itemKey}`; }
function getQuotaVal(level, dk, itemKey) { return parseInt(localStorage.getItem(getQuotaKey(level,dk,itemKey)) || '0', 10); }
function setQuotaVal(level, dk, itemKey, val) { localStorage.setItem(getQuotaKey(level,dk,itemKey), String(Math.max(0,val))); }

function allQuotaItems(level) {
  const q = DAILY_QUOTA[level];
  if (!q) return [];
  return [...q.stories, ...q.habits];
}
function isDateComplete(level, dk) {
  const items = allQuotaItems(level);
  if (!items.length) return false;
  return items.every(it => getQuotaVal(level, dk, it.key) >= it.target);
}
function calcStreak(level) {
  let streak = 0;
  let d = new Date();
  if (!isDateComplete(level, dateKey(d))) d.setDate(d.getDate()-1);
  while (isDateComplete(level, dateKey(d))) {
    streak++;
    d.setDate(d.getDate()-1);
  }
  return streak;
}

  currentPhase = phases.find(p => todayNum >= p.range[0] && todayNum <= p.range[1]) || phases[2];

  document.getElementById('calDayNum').textContent = now.getDate();
  document.getElementById('calWeekday').textContent = WEEKDAYS[now.getDay()];

    comingSoon.classList.remove('hidden');
    learnTab.classList.add('hidden');
    dailyTab.classList.add('hidden');
    checklistTab.classList.add('hidden');
    meTab.classList.add('hidden');
    return;
  }

  subRow.style.display = 'flex';
  comingSoon.classList.add('hidden');
  learnTab.classList.toggle('hidden', currentSub !== 'learn');
  dailyTab.classList.toggle('hidden', currentSub !== 'daily');
  checklistTab.classList.toggle('hidden', currentSub !== 'checklist');
  meTab.classList.toggle('hidden', currentSub !== 'me');

  if (currentSub === 'learn') renderLearnTab();
  else if (currentSub === 'daily') renderDailyTab();
  else if (currentSub === 'checklist') renderChecklistTab();
  else renderMeTab();
}

function renderLearnTab() {
  const level = LEVELS.find(l => l.key === currentLevel);
  document.getElementById('learnPathTitle').textContent = `${level.label}學習路徑`;
  const pathPhases = LEARNING_PATH[currentLevel] || [];

  if (!pathPhases.length) {
    document.getElementById('phaseList').innerHTML = `
      <div class="coming-soon" style="padding:40px 20px;">
        <div class="coming-soon-icon">📝</div>
        <div class="coming-soon-text">${level.label}的學習路徑內容<br>還在準備中，敬請期待！</div>
      </div>`;
    return;
  }

  document.getElementById('phaseList').innerHTML = pathPhases.map((phase, pIdx) => {
    const unlocked = isPhaseUnlocked(currentLevel, pIdx);
    const doneCount = phase.items.filter((_,i) => isLearnChecked(currentLevel, pIdx, i)).length;
    const pct = Math.round((doneCount / phase.items.length) * 100);
    const isOpen = phaseOpenIdx === pIdx;
    return `
    <div class="phase-card ${unlocked?'':'locked'}">
      <button class="phase-head" onclick="${unlocked ? `togglePhaseOpen(${pIdx})` : ''}">
        <div class="phase-head-left">
          <div class="phase-bar" style="background:${phase.color}"></div>
          <div>
            <div class="phase-title">${phase.title}</div>
            <div class="phase-sub">${doneCount}/${phase.items.length} 完成</div>
          </div>
        </div>
        <div class="phase-head-right">
          ${unlocked
            ? `<span class="phase-pct">${pct}%</span><span class="phase-arrow">${isOpen?'▲':'▼'}</span>`
            : `<span class="phase-lock">🔒 解鎖中</span>`}
        </div>
      </button>
      <div class="phase-body ${isOpen && unlocked ? '' : 'hidden'}">
        ${phase.items.map((item, iIdx) => {
          const checked = isLearnChecked(currentLevel, pIdx, iIdx);
          return `
          <div class="phase-item" onclick="toggleLearnItem(${pIdx},${iIdx})">
            <div class="phase-check ${checked?'checked':''}">${checked?'✓':''}</div>
            <span class="phase-item-text ${checked?'checked':''}">${item}</span>
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }).join('');
}

function togglePhaseOpen(idx) {
  phaseOpenIdx = phaseOpenIdx === idx ? null : idx;
  renderLearnTab();
}

function toggleLearnItem(phaseIdx, itemIdx) {
  const now = !isLearnChecked(currentLevel, phaseIdx, itemIdx);
  setLearnChecked(currentLevel, phaseIdx, itemIdx, now);
  renderLearnTab();
}

function renderChecklistTab() {
  const level = LEVELS.find(l => l.key === currentLevel);
  const data = CHECKLIST[currentLevel];
  const emptyState = document.getElementById('checklistEmptyState');
  const container = document.getElementById('checklistContainer');

  if (!data) {
    document.getElementById('checklistEmptyText').innerHTML = `${level.label}的檢核表內容<br>還在準備中，敬請期待！`;
    emptyState.classList.remove('hidden');
    container.classList.add('hidden');
    return;
  }
  emptyState.classList.add('hidden');
  container.classList.remove('hidden');

  document.getElementById('checklistTitle').textContent = data.title;
  document.getElementById('checklistSubtitle').textContent = data.subtitle;

  document.getElementById('checklistSteps').innerHTML = data.steps.map((step, sIdx) => `
    <div class="checklist-step-card">
      <div class="checklist-step-head">
        <div class="checklist-step-badge" style="background:${data.color}">${step.step}</div>
        <div class="checklist-step-title">${step.title}</div>
      </div>
      <div class="checklist-step-body">
        ${step.subLabel ? `<div class="checklist-sub-label">${step.subLabel}</div>` : ''}
        ${step.items.map((item, iIdx) => {
          const checked = isChecklistChecked(currentLevel, sIdx, iIdx);
          return `
          <div class="checklist-item" onclick="toggleChecklistItem(${sIdx},${iIdx})">
            <div class="checklist-check ${checked?'checked':''}" style="${checked?`background:${data.color}`:''}">${checked?'✓':''}</div>
            <span class="checklist-text ${checked?'checked':''}">${item}</span>
          </div>`;
        }).join('')}
      </div>
    </div>`).join('');

  document.getElementById('checklistBanner').textContent = data.bannerText;
  document.getElementById('checklistBanner').style.background = data.color;
}

function toggleChecklistItem(stepIdx, itemIdx) {
  const now = !isChecklistChecked(currentLevel, stepIdx, itemIdx);
  setChecklistChecked(currentLevel, stepIdx, itemIdx, now);
  renderChecklistTab();
}

function buildDailyDayStrip() {
  const strip = document.getElementById('dailyDayStrip');
  let html = '';
  for (let d = 1; d <= 90; d++) {
    const isToday = d === todayNum;
    const isSelected = d === viewDayNum;
    const dk = dayNumToKey(d);
    const complete = isDateComplete(currentLevel, dk);
    html += `<div class="ddp ${isToday?'today':''} ${isSelected?'selected':''}" id="ddp-${d}" onclick="selectQuotaDay(${d})">
      ${complete ? `<div class="ddp-dot"></div>` : ''}
      <span class="ddp-num">${d}</span>
      <span class="ddp-sub">Day</span>
    </div>`;
  }
  strip.innerHTML = html;
  const sel = document.getElementById(`ddp-${viewDayNum}`);
  if (sel) sel.scrollIntoView({ behavior:'smooth', block:'nearest', inline:'center' });
}

function selectQuotaDay(d) {
  viewDayNum = d;
  renderDailyTab();
}

function backToTodayQuota() {
  viewDayNum = todayNum;
  renderDailyTab();
}

function renderDailyTab() {
  const level = LEVELS.find(l => l.key === currentLevel);
  const quota = DAILY_QUOTA[currentLevel];
  const emptyState = document.getElementById('dailyEmptyState');
  const container = document.getElementById('dailyQuotaContainer');

  if (!quota) {
    document.getElementById('dailyEmptyText').innerHTML = `${level.label}的每日額度設定<br>還在準備中，敬請期待！`;
    emptyState.classList.remove('hidden');
    container.classList.add('hidden');
    return;
  }
  emptyState.classList.add('hidden');
  container.classList.remove('hidden');

  buildDailyDayStrip();

  const dk = dayNumToKey(viewDayNum);
  const viewedDate = dayNumToDate(viewDayNum);
  document.getElementById('dailyDateText').textContent = viewedDate.toLocaleDateString('zh-TW',{year:'numeric',month:'long',day:'numeric',weekday:'long'});

  const banner = document.getElementById('viewingDayBanner');
  const bannerLabel = document.getElementById('viewingDayLabel');
  if (viewDayNum !== todayNum) {
    banner.classList.remove('hidden');
    bannerLabel.textContent = `📅 正在查看 Day ${viewDayNum} 的紀錄`;
    document.getElementById('dailyGreetText').textContent = `Day ${viewDayNum} 的打卡紀錄`;
  } else {
    banner.classList.add('hidden');
    const h = new Date().getHours();
    document.getElementById('dailyGreetText').textContent = h < 12 ? '早安！新的一天加油 🌱' : h < 18 ? '下午好！繼續衝 💪' : '晚安前再衝一波 🌙';
  }

  const allItems = allQuotaItems(currentLevel);
  const doneCount = allItems.filter(it => getQuotaVal(currentLevel, dk, it.key) >= it.target).length;

  document.getElementById('statDone').textContent = doneCount;
  document.getElementById('statTotal').textContent = allItems.length;
  document.getElementById('statStreak').textContent = calcStreak(currentLevel);

  const storyDone = quota.stories.filter(it => getQuotaVal(currentLevel, dk, it.key) >= it.target).length;
  document.getElementById('storyQuotaCount').textContent = `${storyDone}/${quota.stories.length}`;
  const totalTarget = quota.stories.reduce((s,it)=>s+it.target,0);
  const ratioColors = ['#A1887F','#8D6E63','#6D4C41'];
  document.getElementById('ratioTags').innerHTML = quota.stories.map((it,i) => {
    const pct = Math.round((it.target/totalTarget)*100);
    return `<span class="ratio-tag"><span class="ratio-dot" style="background:${ratioColors[i%3]}"></span>${it.label} ${pct}%</span>`;
  }).join('');
  document.getElementById('storyQuotaList').innerHTML = quota.stories.map(it => renderQuotaItem(it, dk)).join('');

  const habitDone = quota.habits.filter(it => getQuotaVal(currentLevel, dk, it.key) >= it.target).length;
  document.getElementById('habitQuotaCount').textContent = `${habitDone}/${quota.habits.length}`;
  document.getElementById('habitQuotaList').innerHTML = quota.habits.map(it => renderQuotaItem(it, dk)).join('');
}

function renderQuotaItem(it, dk) {
  const val = getQuotaVal(currentLevel, dk, it.key);
  const met = val >= it.target;
  return `
  <div class="quota-item ${met?'met':''}">
    <div class="quota-item-left">
      <span class="quota-icon">${it.icon}</span>
      <div>
        <div class="quota-item-label">${it.label}</div>
        <div class="quota-item-target">目標：${it.target} 則</div>
      </div>
    </div>
    <div class="quota-counter">
      <button class="quota-btn" onclick="adjustQuota('${it.key}',-1)">−</button>
      <span class="quota-value ${met?'met':''}">${val}</span>
      <button class="quota-btn plus" onclick="adjustQuota('${it.key}',1)">+</button>

    </div>
  </div>`;
}

function adjustQuota(itemKey, delta) {
  const dk = dayNumToKey(viewDayNum);
  const cur = getQuotaVal(currentLevel, dk, itemKey);
  setQuotaVal(currentLevel, dk, itemKey, cur + delta);
  renderDailyTab();
}

function renderMeTab() {
  const milestones = [
    {day:1,label:'入職',icon:'🌱'},{day:7,label:'一週',icon:'📅'},
    {day:30,label:'一月',icon:'🏅'},{day:60,label:'兩月',icon:'🚀'},{day:90,label:'結業',icon:'🎓'},
  ];
  document.getElementById('milestoneRow').innerHTML = milestones.map(m => {
    const done = todayNum >= m.day, cur = todayNum === m.day;
    return `<div class="milestone" style="opacity:${done?1:0.28}">
      <span class="milestone-icon" style="${cur?'transform:scale(1.3);filter:drop-shadow(0 2px 8px rgba(109,76,65,0.4))':''}">${m.icon}</span>
      <span class="milestone-day">Day ${m.day}</span>
      <span class="milestone-label">${m.label}</span>
    </div>`;
  }).join('');

  const pathPhases = LEARNING_PATH[currentLevel] || [];
  const totalItems = pathPhases.reduce((s,p)=>s+p.items.length,0);
  const doneItems = pathPhases.reduce((s,p,pIdx)=>s+p.items.filter((_,i)=>isLearnChecked(currentLevel,pIdx,i)).length,0);
  const completedPhases = pathPhases.filter((_,pIdx)=>isPhaseComplete(currentLevel,pIdx)).length;
  const streak = calcStreak(currentLevel);

  document.getElementById('meStatsCard').innerHTML = `
    <div class="me-stat-row"><span class="me-stat-label">目前等級</span><span class="me-stat-value">${LEVELS.find(l=>l.key===currentLevel).label}</span></div>
    <div class="me-stat-row"><span class="me-stat-label">學習進度</span><span class="me-stat-value">${doneItems} / ${totalItems} 項</span></div>
    <div class="me-stat-row"><span class="me-stat-label">已完成階段</span><span class="me-stat-value">${completedPhases} / ${pathPhases.length}</span></div>
    <div class="me-stat-row"><span class="me-stat-label">連續打卡</span><span class="me-stat-value">${streak} 天 🔥</span></div>
  `;
}

const mainTabs = ['home','review','presale','insale','aftersale'];
function switchTab(key, btn) {
  mainTabs.forEach(t => document.getElementById('tab-'+t).classList.add('hidden'));
  document.getElementById('tab-'+key).classList.remove('hidden');
  document.getElementById('levelStrip').style.display = key === 'home' ? '' : 'none';
  if (key !== 'home') document.getElementById('subTabRow').style.display = 'none';
  else renderLevelView();
  document.querySelectorAll('.tab-btn').forEach(b => {
    b.querySelector('.tab-icon-wrap').classList.remove('active');
    b.querySelector('.tab-label').classList.remove('active');
  });
  btn.querySelector('.tab-icon-wrap').classList.add('active');
  btn.querySelector('.tab-label').classList.add('active');
  document.getElementById('content').scrollTop = 0;
}

function getHistoryKey(tab) { return `review_history_${tab}`; }
function switchReview(tab, btn) {
  reviewTab = tab;
  document.querySelectorAll('.seg-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderReview();
}
function renderReview() {
  const prompts = reviewPrompts[reviewTab];
  const draft = JSON.parse(localStorage.getItem('review_draft_'+reviewTab) || '{}');
  document.getElementById('reviewQuestions').innerHTML = prompts.map((q,i) => `
    <div class="prompt-group">
      <div class="prompt-q">Q${i+1}. ${q}</div>
      <textarea id="rq${i}" placeholder="點此輸入..." oninput="saveDraft()">${draft[i]||''}</textarea>
    </div>`).join('');
  renderHistory();
}
function saveDraft() {
  const data = {};
  reviewPrompts[reviewTab].forEach((_,i) => {
    const el = document.getElementById('rq'+i);
    if (el) data[i] = el.value;
  });
  localStorage.setItem('review_draft_'+reviewTab, JSON.stringify(data));
}
function saveReview() {
  const prompts = reviewPrompts[reviewTab];
  const data = {};
  let hasContent = false;
  prompts.forEach((_,i) => {
    const val = document.getElementById('rq'+i).value.trim();
    data[i] = val;
    if (val) hasContent = true;
  });
  if (!hasContent) return;
  const now = new Date();
  const dateStr = now.toLocaleDateString('zh-TW', { year:'numeric', month:'long', day:'numeric', weekday:'short' });
  const timeStr = now.toLocaleTimeString('zh-TW', { hour:'2-digit', minute:'2-digit' });
  const history = JSON.parse(localStorage.getItem(getHistoryKey(reviewTab)) || '[]');
  history.unshift({ date: dateStr, time: timeStr, data });
  localStorage.setItem(getHistoryKey(reviewTab), JSON.stringify(history));
  localStorage.removeItem('review_draft_'+reviewTab);
  const btn = document.querySelector('.save-btn');
  btn.textContent = '✅ 已儲存！';
  setTimeout(() => { btn.textContent = '☕ 儲存復盤'; renderReview(); }, 1200);
}
function renderHistory() {
  const prompts = reviewPrompts[reviewTab];
  const history = JSON.parse(localStorage.getItem(getHistoryKey(reviewTab)) || '[]');
  const container = document.getElementById('reviewHistory');
  if (!history.length) {
    container.innerHTML = `<div class="history-empty">還沒有復盤記錄，儲存後就會出現在這裡 ☕</div>`;
    return;
  }
  container.innerHTML = history.map(entry => `
    <div class="history-card">
      <div class="history-date"><span class="history-date-dot"></span>${entry.date}・${entry.time}</div>
      ${prompts.map((q,i) => entry.data[i] ? `
        <div class="history-qa">
          <div class="history-q">Q${i+1}. ${q}</div>
          <div class="history-a">${entry.data[i].replace(/\n/g,'<br>')}</div>
        </div>` : ''
      ).join('')}
    </div>`).join('');
}

const saleColors = { presale:'#8D6E63', insale:'#795548', aftersale:'#6D4C41' };
function renderSaleTabs() {
  ['presale','insale','aftersale'].forEach(key => {
    const color = saleColors[key];
    document.getElementById(key+'-body').innerHTML = saleData[key].map((s,i) => `
      <div class="accordion">
        <button class="accordion-head" style="border-left:3px solid ${color}" onclick="toggleAccordion('${key}-${i}')">
          <span>${s.title}</span>
          <span id="arr-${key}-${i}" style="font-size:15px;color:${color};opacity:0.8">▼</span>
        </button>
        <div class="accordion-body hidden" id="body-${key}-${i}">
          ${s.items.map(item=>`<div class="check-item"><span class="check-dot" style="background:${color}"></span>${item}</div>`).join('')}
        </div>
      </div>`).join('');
  });
}
function toggleAccordion(id) {
  const body = document.getElementById('body-'+id);
  const arr  = document.getElementById('arr-'+id);
  const open = !body.classList.contains('hidden');
  body.classList.toggle('hidden', open);
  arr.textContent = open ? '▼' : '▲';
}

if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js').catch(()=>{}); }
init();
</script>
